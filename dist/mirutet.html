  <meta name="description" content="ミルテトは、ミルテト学園のミルフィとテトリミノの操作を学ぶブラウザゲームシリーズです。現在は最短操作の「フィネス編」、自由に積んで消す「フリーモード」、くぼみに回して入れる「回転入れ編」で遊べます。オフライン対応。">
  <meta property="og:title" content="ミルテト">
  <meta property="og:description" content="ミルテトは、ミルテト学園のミルフィとテトリミノの操作を学ぶブラウザゲームシリーズです。現在は最短操作の「フィネス編」、自由に積んで消す「フリーモード」、くぼみに回して入れる「回転入れ編」で遊べます。オフライン対応。">
  <title>ミルテト</title>
  <style>
.mirufi { display: block; max-width: 100%; height: auto; overflow: hidden;
  --mirufi-sway: .7deg; --mirufi-sway-time: 4.8s; }
.mirufi--happy { --mirufi-sway: 1.4deg; --mirufi-sway-time: 3s; }
.mirufi--surprised { --mirufi-sway: 1.1deg; --mirufi-sway-time: 2.6s; }
.mirufi--thinking { --mirufi-sway: .5deg; --mirufi-sway-time: 5.6s; }
.mirufi--sorry { --mirufi-sway: .65deg; --mirufi-sway-time: 5s; }
.mirufi .mirufi-eyes-closed { opacity: 0; }
.mirufi--animated .mirufi-bob { animation: mirufi-bob 4s ease-in-out infinite; }
.mirufi--animated .mirufi-tail--left { transform-origin: 68px 110px;
  animation: mirufi-sway-left var(--mirufi-sway-time) ease-in-out infinite; }
.mirufi--animated .mirufi-tail--right { transform-origin: 232px 110px;
  animation: mirufi-sway-right var(--mirufi-sway-time) ease-in-out infinite; }
.mirufi--animated .mirufi-eyes-open { animation: mirufi-open 5.7s steps(1, end) infinite; }
.mirufi--animated .mirufi-eyes-closed { animation: mirufi-blink 5.7s steps(1, end) infinite; }
.mirufi--animated .mirufi-sparkle { transform-box: fill-box; transform-origin: center;
  animation: mirufi-twinkle 3.2s ease-in-out infinite; }
.mirufi--animated .mirufi-sparkle:nth-child(even) { animation-delay: -1.6s; }
@keyframes mirufi-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes mirufi-sway-left { 0%, 100% { transform: rotate(calc(-1 * var(--mirufi-sway))); }
  50% { transform: rotate(var(--mirufi-sway)); } }
@keyframes mirufi-sway-right { 0%, 100% { transform: rotate(var(--mirufi-sway)); }
  50% { transform: rotate(calc(-1 * var(--mirufi-sway))); } }
@keyframes mirufi-open { 0%, 43%, 46%, 100% { opacity: 1; } 44%, 45% { opacity: 0; } }
@keyframes mirufi-blink { 0%, 43%, 46%, 100% { opacity: 0; } 44%, 45% { opacity: 1; } }
@keyframes mirufi-twinkle { 0%, 100% { opacity: .5; transform: scale(.88); }
  50% { opacity: 1; transform: scale(1.08); } }
@media (prefers-reduced-motion: reduce) {
  .mirufi--animated .mirufi-bob, .mirufi--animated .mirufi-eyes-open,
  .mirufi--animated .mirufi-eyes-closed, .mirufi--animated .mirufi-sparkle,
  .mirufi--animated .mirufi-tail--left, .mirufi--animated .mirufi-tail--right { animation: none; }
  .mirufi .mirufi-eyes-open { opacity: 1; }
  .mirufi .mirufi-eyes-closed { opacity: 0; }
}
:root {
  --ink:#49445e;
  --muted:#8c849e;
  --pink:#e58ba9;
  --purple:#9a82c8;
  --mint:#77bcab;
  --line:#e9e1f0;
  --paper:#fffdfefa;
  --shadow:0 8px 30px #72588d0a;
  --cell:min(24px,calc((100vh - 236px)/22));
  font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo","Noto Sans CJK JP",sans-serif;
  color:var(--ink);
  font-size:14px;
  font-synthesis:none
}

* {
  box-sizing:border-box
}

body {
  margin:0;
  min-width:1000px;
  background:radial-gradient(ellipse at 8% 4%,#fcebf2 0,transparent 42%),radial-gradient(ellipse at 90% 80%,#eaf6f2 0,transparent 45%),#f8f5fc
}

button,input,select,textarea {
  font:inherit;
  color:inherit
}

button {
  cursor:pointer;
  border:1px solid var(--line);
  background:#fff;
  border-radius:12px;
  padding:10px 15px;
  transition:background .15s,transform .15s,box-shadow .15s
}

button:hover {
  background:#f6f0fc;
  border-color:#d2bfe7;
  transform:translateY(-1px)
}

button:active {
  transform:translateY(1px)
}

button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible {
  outline:3px solid #b6a0da;
  outline-offset:3px
}

button:disabled {
  opacity:.42;
  cursor:default;
  transform:none
}

.primary {
  color:#fff;
  background:linear-gradient(125deg,#bd9cda,#a48aca);
  border-color:transparent;
  box-shadow:0 5px 14px #a183c52d
}

.primary:hover {
  background:#a086c2
}

.pink {
  background:#fbedf3;
  color:#b86f8b;
  border-color:#efd4df
}

.quiet {
  background:transparent;
  border-color:transparent
}

.small {
  font-size:13px;
  padding:7px 11px;
  border-radius:9px
}

.danger {
  color:#bc7288
}

.eyebrow {
  font-size:13px;
  letter-spacing:.2em;
  font-weight:800;
  color:#a38ab9;
  text-transform:uppercase
}

.muted {
  color:var(--muted)
}

.tiny {
  font-size:13px;
  color:var(--muted)
}

h1,h2,h3,p {
  margin:0
}

h2 {
  font-size:23px;
  letter-spacing:.04em
}

h3 {
  font-size:14px
}

.row {
  display:flex;
  align-items:center;
  gap:10px
}

.spread {
  justify-content:space-between
}

.stack {
  display:grid;
  gap:14px
}

.panel {
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:var(--shadow);
  padding:18px
}

.tag {
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:#f0eaf8;
  border:1px solid #e7dff0;
  color:#9278b3;
  border-radius:30px;
  padding:4px 9px;
  font-size:13px;
  letter-spacing:.06em
}

.mint-tag {
  color:#5b9e8e;
  background:#e9f5ef;
  border-color:#d2eade
}

.topbar {
  height:72px;
  padding:0 34px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #e9e1f0aa;
  background:#fffc;
  gap:20px
}

.brand {
  display:flex;
  gap:11px;
  align-items:center;
  font-size:20px;
  font-weight:800;
  line-height:1.2;
  letter-spacing:.08em
}

.brand-button {
  border:0;
  background:none;
  padding:0
}

.brand-mark {
  display:grid;
  grid-template-columns:repeat(3,8px);
  grid-template-rows:repeat(2,8px);
  gap:2px;
  transform:rotate(-7deg)
}

.brand-mark i {
  background:#b6a1d4;
  border-radius:2px
}

.brand-mark i:first-child {
  grid-column:2;
  background:#e7adc2
}

.top-actions {
  display:flex;
  gap:10px;
  align-items:center
}

.page {
  max-width:1140px;
  margin:auto;
  padding:28px 18px
}

.page-heading {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px
}

.page-heading p {
  margin-top:7px;
  color:var(--muted);
  font-size:13px
}

.footer {
  font-size:13px;
  color:#a69bb2;
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:15px 34px;
  letter-spacing:.04em
}

kbd {
  font-family:inherit;
  font-size:13px;
  font-weight:600;
  line-height:1.2;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:27px;
  min-height:26px;
  padding:4px 7px;
  border:1px solid #dfd5eb;
  border-bottom:3px solid #d9cde7;
  border-radius:6px;
  background:#fff;
  color:#7c668f;
  white-space:nowrap
}

kbd.pressed {
  background:#b498d0;
  color:#fff;
  border-color:#a284c2;
  transform:translateY(2px);
  box-shadow:0 0 13px #c3a6e680
}

.sequence {
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  align-items:center;
  min-height:30px
}

.sequence .arrow {
  color:#c7bbd2;
  font-size:13px
}

.sequence small {
  font-size:13px;
  margin-left:4px;
  color:#b48ac0
}

.empty-route {
  font-size:13px;
  color:var(--muted)
}

/* Title screen */
.menu {
  max-width:1080px;
  min-height:calc(100vh - 116px);
  margin:auto;
  display:grid;
  grid-template-columns:1.05fr 1fr;
  gap:58px;
  align-items:center;
  padding:32px
}

.menu-copy .eyebrow {
  display:flex;
  align-items:center;
  gap:10px
}

.menu-copy .eyebrow:before {
  content:"";
  width:22px;
  height:1px;
  background:#cdb7df
}

.logo {
  font-weight:900;
  line-height:1.17;
  font-size:66px;
  letter-spacing:.04em;
  margin:22px 0 15px;
  color:#a783bd;
  text-shadow:2px 3px 0 #fff
}

.logo span {
  color:#db93af
}

.menu-intro {
  line-height:2;
  color:#93849f;
  font-size:13px;
  margin-bottom:26px
}

.menu-buttons {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px
}

.menu-mode {
  display:flex;
  gap:8px;
  margin-bottom:12px
}

.menu-mode button { padding:7px 16px; font-size:14px; }
.menu-mode button[aria-pressed=true] { background:#eee5f7; border-color:#bda5d1; color:#795b93; }

.menu-buttons button {
  text-align:left;
  min-height:62px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:13px 17px
}

.menu-buttons button:first-child {
  grid-column:1/-1
}

.menu-buttons button b {
  display:block;
  font-size:14px;
  letter-spacing:.04em
}

.menu-buttons button small {
  display:block;
  font-size:13px;
  font-weight:400;
  letter-spacing:.03em;
  opacity:.7;
  margin-top:4px
}

.menu-buttons .button-arrow {
  opacity:.65;
  font-size:20px
}

.first-note {
  margin-top:15px;
  font-size:13px;
  color:#ac8cb4;
  display:flex;
  align-items:center;
  gap:8px
}

.menu-art {
  position:relative;
  text-align:center
}

.menu-art:before {
  content:"";
  position:absolute;
  inset:40px -10px 65px;
  border-radius:50%;
  background:radial-gradient(circle,#f0e6f7 0,#f9f5fc00 70%)
}

.menu-art .mascot-wrap {
  max-width:370px;
  margin:auto;
  position:relative
}

.speech {
  background:#fff;
  border:1px solid #e7dbee;
  border-radius:18px;
  padding:17px 19px;
  line-height:1.9;
  font-size:13px;
  position:relative;
  box-shadow:0 5px 20px #9c7baa0a
}

.speech:after {
  content:"";
  position:absolute;
  bottom:-7px;
  left:50%;
  height:12px;
  width:12px;
  background:#fff;
  border-right:1px solid #e7dbee;
  border-bottom:1px solid #e7dbee;
  transform:rotate(45deg)
}

.speaker {
  display:block;
  font-size:13px;
  font-weight:800;
  letter-spacing:.03em;
  color:#ad88bc;
  margin-bottom:5px
}

.menu-art .speech {
  max-width:340px;
  margin:0 auto 8px;
  text-align:left;
  z-index:1
}

.mascot-caption {
  font-size:13px;
  color:#ad9cb7;
  letter-spacing:.15em;
  margin-top:10px
}

.float-block {
  position:absolute;
  width:19px;
  height:19px;
  border-radius:5px;
  background:#edc6d5;
  box-shadow:21px 0 #edc6d5,21px -21px #edc6d5,42px -21px #edc6d5;
  transform:rotate(13deg);
  left:17px;
  top:46%;
  opacity:.6
}

.float-block.two {
  left:auto;
  right:32px;
  top:67%;
  background:#bce3d6;
  box-shadow:21px 0 #bce3d6,-21px 0 #bce3d6,0 -21px #bce3d6;
  transform:rotate(-15deg)
}

/* Training workspace: all three columns fit at 1280 x 720. */
.play-page {
  padding:17px 28px 0;
  max-width:1260px;
  margin:auto
}

.play-topline {
  height:30px;
  margin-bottom:12px
}

.play-title {
  font-size:17px;
  display:flex;
  align-items:center;
  gap:10px
}

.play-grid {
  display:grid;
  grid-template-columns:minmax(220px,1fr) 428px minmax(230px,1fr);
  gap:22px;
  align-items:start;
  height:calc(100vh - 166px)
}

.coach {
  display:flex;
  flex-direction:column;
  gap:12px;
  height:100%;
  min-height:0
}

.coach .speech {
  min-height:116px;
  font-size:13px
}

.coach .mascot-wrap {
  width:200px;
  max-height:234px;
  margin:0 auto;
  flex:1;
  min-height:120px
}

.coach .mirufi {
  height:100%;
  width:100%;
  max-height:240px
}

.coach .speaker {
  font-size:13px
}

.practice-options {
  padding:13px 15px
}

.practice-options h3 {
  font-size:13px;
  color:#887794;
  margin-bottom:10px
}

.piece-filters {
  display:flex;
  gap:5px;
  flex-wrap:wrap
}

.piece-check input {
  position:absolute;
  opacity:0
}

.piece-check span {
  display:inline-flex;
  width:27px;
  height:27px;
  align-items:center;
  justify-content:center;
  border-radius:7px;
  border:1px solid var(--line);
  font-size:13px;
  cursor:pointer;
  color:#c4bbca
}

.piece-check input:checked+span {
  background:#f0eaf8;
  border-color:#cbb7df;
  color:#79618c;
  font-weight:800
}

.piece-check input:focus-visible+span {
  outline:2px solid #aa8fc7
}

.filter-line {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:5px;
  margin-top:9px;
  font-size:13px
}

.filter-line select {
  width:120px;
  padding:4px;
  border-radius:6px;
  border:1px solid var(--line);
  background:#fff
}

.filter-line input[type=number] {
  width:45px;
  padding:3px
}

.checkline {
  display:flex;
  align-items:center;
  gap:7px;
  font-size:13px;
  line-height:1.7
}

.checkline input {
  accent-color:#aa89c9
}

.filter-error {
  font-size:13px;
  color:#b35e7a;
  margin-top:6px
}

.board-stage {
  display:grid;
  grid-template-columns:76px calc(var(--cell)*10) 76px;
  gap:12px;
  justify-content:center
}

.board-column {
  position:relative
}

.board-heading {
  height:25px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:13px;
  color:#a18eaf;
  letter-spacing:.03em
}

.board-shell {
  position:relative;
  border-radius:10px;
  overflow:hidden;
  border:1px solid #d8cde5;
  box-shadow:0 6px 24px #8a6da716;
  background:#faf9fd;
  width:calc(var(--cell)*10 + 2px);
  height:calc(var(--cell)*22 + 2px)
}

canvas.board {
  display:block;
  width:calc(var(--cell)*10);
  height:calc(var(--cell)*22)
}

.column-labels {
  display:grid;
  grid-template-columns:repeat(10,1fr);
  font-size:13px;
  text-align:center;
  color:#b6a9c0;
  padding-top:7px
}

.board-note {
  text-align:center;
  font-size:13px;
  color:#b4a3bf;
  margin-top:8px
}

.side-queue {
  padding-top:25px
}

.queue-box {
  background:#fffc;
  border:1px solid #e8dff0;
  border-radius:12px;
  overflow:hidden;
  text-align:center
}

.queue-title {
  font-size:13px;
  letter-spacing:.03em;
  color:#a18daf;
  padding:10px 0 3px
}

.mini-piece {
  display:block;
  width:72px;
  height:54px;
  margin:auto
}

.queue-box .mini-piece+.mini-piece {
  border-top:1px solid #f2edf6
}

.hold-note {
  font-size:13px;
  line-height:1.7;
  color:#ac9cb5;
  margin-top:9px;
  text-align:center
}

.key-help {
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:17px;
  justify-content:center
}

.key-help kbd {
  font-size:13px;
  min-width:25px;
  padding:3px;
  min-height:22px
}

/* Play screens reserve this space even below two successes. The pop
   stays inside the queue/coach column, clear of the board and speech bubble. */
.finesse-combo {
  position:relative;
  height:90px;
  flex:0 0 90px;
  display:grid;
  place-items:center;
  overflow:hidden;
  pointer-events:none
}

.sr-only,.combo-announcement {
  position:absolute;
  width:1px;
  height:1px;
  padding:0;
  margin:-1px;
  overflow:hidden;
  clip-path:inset(50%);
  white-space:nowrap;
  border:0
}

.combo-display {
  --combo-scale:1.04;
  --combo-turn:0deg;
  --combo-duration:.32s;
  position:relative;
  width:68px;
  padding:7px 2px;
  border:1px solid #dfd2eb;
  border-radius:18px;
  background:linear-gradient(145deg,#fffdfd,#f2eaf9);
  color:#9874b4;
  text-align:center;
  line-height:1.1;
  box-shadow:0 3px 10px #b59acc20
}

.combo-display strong { display:block; font-size:26px; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
.combo-display span { font-size:13px; font-weight:800; letter-spacing:.02em; }
.combo-display[data-tier="5"] { --combo-scale:1.08; --combo-turn:-2deg; --combo-duration:.42s; border-color:#e6b8cc; color:#b87596; background:linear-gradient(145deg,#fffdfd,#fbe7f0); }
.combo-display[data-tier="10"] { --combo-scale:1.1; --combo-turn:3deg; --combo-duration:.48s; border-color:#b5d8cc; color:#5c9988; background:linear-gradient(145deg,#fffef7,#e4f6ed); }
.combo-display[data-tier="20"] { --combo-scale:1.12; --combo-turn:-4deg; --combo-duration:.55s; border-color:#cbb1e2; color:#9566b1; background:linear-gradient(145deg,#fff4f9,#eee2fc); }
.combo-display[data-tier="50"] { --combo-scale:1.14; --combo-turn:4deg; --combo-duration:.65s; border-color:#e6c58b; color:#ac8051; background:linear-gradient(145deg,#fff7da,#fbe3ef); box-shadow:0 0 12px #e9c3d780; }
.combo-display[data-tier="10"]:before,.combo-display[data-tier="20"]:before,.combo-display[data-tier="50"]:before {
  content:"✧";
  position:absolute;
  top:2px;
  right:3px;
  font-size:13px
}
.combo-display.pop { animation:combo-pop var(--combo-duration) ease-out; }
@keyframes combo-pop {
  0% { transform:scale(.88); opacity:.6; }
  35% { transform:scale(var(--combo-scale)) rotate(var(--combo-turn)); opacity:1; }
  65% { transform:scale(.98) rotate(calc(-1 * var(--combo-turn))); }
  100% { transform:scale(1); }
}

.irs-flash {
  position:absolute;
  top:47px;
  left:50%;
  transform:translateX(-50%);
  background:#a485c9e8;
  color:#fff;
  font-size:13px;
  border-radius:20px;
  padding:5px 15px;
  letter-spacing:.18em;
  opacity:0;
  transition:opacity .12s;
  pointer-events:none
}

.irs-flash.visible {
  opacity:1
}

.are-track {
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:3px;
  background:#e7def1;
  opacity:0
}

.are-track.visible {
  opacity:1
}

.are-fill {
  height:100%;
  background:#b396ce;
  width:0
}

.right-stack {
  display:grid;
  gap:12px
}

.stats-panel {
  padding:16px
}

.panel-label {
  font-size:13px;
  letter-spacing:.03em;
  color:#9e8eaa;
  font-weight:700;
  margin-bottom:12px
}

.stats-main {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.stat strong {
  font-size:27px;
  font-weight:600;
  letter-spacing:-.04em;
  line-height:1.2
}

.stat strong.accent {
  color:#b88bca

#toast {
  position:fixed;
  top:10px;
  left:50%;
  max-width:min(560px,calc(100vw - 48px));
  transform:translateX(-50%) translateY(-8px);
  padding:11px 20px;
  border:1px solid #dfcee9;
  background:#fffcff;
  border-radius:30px;
  box-shadow:var(--shadow);
  z-index:30;
  font-size:13px;
  color:#9d7cb0;
  visibility:hidden;
  opacity:0;
  pointer-events:none;
  /* Visibility must change immediately; transitioning it hides text at t=0. */
  transition:opacity .2s,transform .2s
}

#toast.visible {
  visibility:visible;
  opacity:1;
  transform:translateX(-50%) translateY(0)

/* Viewport layout: readable type and a height budget for every board sibling.
   Settings/long lesson tables scroll inside their labelled, focusable panel. */
:root {
  --muted:#766c88;
  --queue:86px;
  --cell:min(36px,calc((100vh - 240px)/22),calc((100vw - 950px)/10));
  font-size:15px;
}
.topbar { height:64px; flex:0 0 64px; }
.footer { min-height:38px; padding:9px 28px; flex:0 0 38px; }
body[data-screen=menu],body[data-screen=tutorial],body[data-screen=settings],body[data-screen=result] { height:100vh; }
body:is([data-screen=menu],[data-screen=tutorial],[data-screen=settings],[data-screen=play],[data-screen=result]) #app {
  height:100%; display:flex; flex-direction:column;
}
.speech,.coach .speech,.lesson-coach .speech { font-size:15px; line-height:1.65; padding:12px 14px; }
.bubble-text { font-size:15px; overflow-wrap:anywhere; white-space:pre-line; }
.speaker,.coach .speaker { font-size:13px; letter-spacing:.02em; line-height:1.4; }
.menu { flex:1; width:100%; min-height:0; padding:18px 28px; }
.menu .logo { font-size:60px; margin:14px 0 12px; }
.menu-intro { font-size:15px; line-height:1.65; margin-bottom:18px; }
.menu-buttons button { min-height:66px; padding:10px 15px; }
.menu-buttons button small { font-size:13px; letter-spacing:.03em; }
.menu-art .mascot-wrap { width:min(36vh,390px); max-width:100%; }
.menu-art .speech { max-width:380px; }
.first-note { margin-top:10px; }
.menu .tiny { margin-top:6px!important; }
.page-heading { flex-shrink:0; gap:16px; }
.page-heading p,.lesson-text,.try-box p { font-size:14px; }
.lesson-page { flex:1; min-height:0; width:100%; max-width:1500px; display:flex; flex-direction:column; padding:16px 24px; }
.lesson-heading { margin-bottom:14px; }
.lesson-steps button { width:28px; height:28px; }
.lesson-grid { flex:1; min-height:0; grid-template-columns:minmax(230px,1fr) minmax(220px,310px) minmax(420px,1.65fr); grid-template-rows:minmax(0,1fr); align-items:stretch; gap:22px; }
.lesson-coach { height:100%; min-height:0; display:flex; flex-direction:column; gap:10px; }
.lesson-coach .speech { min-height:0; flex:0 0 auto; }
.lesson-coach .mascot-wrap { flex:1; min-height:0; width:100%; max-width:310px; }
.lesson-coach .mirufi { width:100%; height:100%; max-height:430px; }
.lesson-board { --cell:min(30px,calc((100vh - 350px)/22)); height:100%; min-height:0; display:flex; flex-direction:column; align-items:center; }
.lesson-board>* { flex-shrink:0; }
.lesson-board .column-labels { width:calc(var(--cell)*10); }
.lesson-board .sequence { margin-top:8px; min-height:30px; }
.lesson-board #demo-caption,.lesson-status { font-size:13px; line-height:1.5; }
.lesson-details { display:flex; flex-direction:column; min-width:0; min-height:0; }
.lesson-content { flex:1; min-width:0; min-height:0; max-height:none; padding-right:10px; overflow:auto; }
.lesson-nav { flex-shrink:0; margin-top:12px; padding:8px 0 0; border-top:1px solid var(--line); }
.lesson-shortcuts { flex-shrink:0; margin-top:8px; line-height:1.5; }
.lesson-text { margin:10px 0; line-height:1.8; }
.lesson-text p+p { margin-top:8px; }
.try-box { padding:12px; margin:12px 0; }
.lesson-table,.lesson-table button,.lesson-table kbd { font-size:13px; }
.settings-page { flex:1; min-height:0; width:100%; max-width:1450px; display:flex; flex-direction:column; padding:16px 24px 0; }
.settings-page .page-heading { margin-bottom:14px; }
.settings-page [data-act=close-settings] { flex-shrink:0; }
.settings-content { flex:1; min-height:0; overflow:auto; padding:4px 10px 12px 4px; scrollbar-width:thin; }
.appearance-panel { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:16px; }
.appearance-panel .outfit-label { display:block; margin-top:12px; }
.appearance-panel select { max-width:100%; }
#appearance-preview { display:flex; flex-shrink:0; }
#appearance-preview .mirufi { width:130px; }
@media(max-width:999px) {
  body[data-screen=settings] { min-width:0; }
  body[data-screen=settings] .topbar { padding:0 16px; }
  body[data-screen=settings] .top-actions .tag { display:none; }
  .settings-grid,.settings-bottom { grid-template-columns:minmax(0,1fr); }
  body[data-screen=settings] .footer { flex-wrap:wrap; gap:4px; font-size:11px; }
}
@media(max-width:700px) {
  .appearance-panel { flex-direction:column; align-items:flex-start; }
  #appearance-preview .mirufi { width:110px; }
}
.lesson-content,.settings-content {
  overscroll-behavior:contain;
  scrollbar-width:thin;
  scrollbar-color:#cdb8dd #f6eff9;
  scrollbar-gutter:stable;
}
.lesson-content::-webkit-scrollbar,.settings-content::-webkit-scrollbar { width:6px; height:6px; }
.lesson-content::-webkit-scrollbar-track,.settings-content::-webkit-scrollbar-track { background:#f6eff9; border-radius:8px; }

        // or replenishes the reset budget. An expired piece locks on recontact.
        if (this.lockDeadline === Infinity) this.lockDeadline = time + this.settings.lockDelay;
        else if (reset && this.lockResets < 15) {
          this.lockResets++;

        }

      }
    }
    _horizontal(key, automatic, initial = false) {
      const delta = key.action === 'left' ? -1 : 1;
      const next = automatic && this.settings.arr === 0 ? slidePiece(this.board, this.active, delta) :
        movePiece(this.board, this.active, delta);
      const moved = next && (next.x !== this.active.x);
      if (moved || !automatic && !initial) {
        const entry = this._record(key.action, key, { initial });
        if (automatic) { entry.slide = true; entry.label = delta < 0 ? 'DAS←' : 'DAS→'; }
      }
      if (moved) { this.active = next; this.lastMove = 'shift'; this._grounded(true); this._emit('move', { action: key.action, automatic, state: { ...next } }); this._wakeFall(); }
      if (automatic) key.nextAt = this.settings.arr === 0 ? Infinity : this.time + this.settings.arr;
    }
    _fall(instant = false) {

      const moved = next && next.y !== this.active.y;

      if (rotateKey) {

      if (direction && !this.paused) {

    _hold(initial) {

      const queueDrawn = !this.heldPiece;
      const from = this.active.type, to = this.heldPiece || pieceType(this.pieceProvider());
      this.heldPiece = from;

    }
    _lock() {
      const state = hardDrop(this.board, this.active);
      if (!state) return;
      if (state.y !== this.active.y) this.lastMove = 'drop';
      const result = { t: this.time, type: state.type, state, cells: cells(state),
        lastMove: this.lastMove, used: this.inputCount, inputs: this.inputs.map(e => ({ ...e })), flags: { ...this.flags } };
      if (this.lockToBoard) this.board.lock(state);
      this.active = null; this.fallAt = this.lockAt = this.lockDeadline = Infinity; this._cut();
      this._emit('lock', result);
      if (this.callbacks.onLock) this.callbacks.onLock(result, this);
      if (this.autoNext && !this.pending && !this.active) this._schedule(pieceType(this.pieceProvider()), this.settings.are);
    }
    _schedule(type, delay) {
      if (!Number.isFinite(delay) || delay < 0) throw new RangeError('Invalid spawn delay');
      this.active = null; this.fallAt = this.lockAt = this.lockDeadline = Infinity;
      const since = this.paused ? this.pauseStarted : this.time;
      this.initialHoldBuffered = false;

      this._emit('are', { type, at: this.pending.at });
    }
    scheduleSpawn(type, t = this.clock(), delay = this.settings.are) {
      this.update(t); this._schedule(type, delay); this.update(t); return this;
    }
    spawn(type, t = this.clock()) { return this.scheduleSpawn(type, t, 0); }
    start(t = this.clock()) { return this.scheduleSpawn(pieceType(this.pieceProvider()), t); }
    update(t = this.clock()) {
      if (!Number.isFinite(t) || t < this.time) throw new RangeError('Time must be finite and monotone');
      if (this._advancing) return this;
      if (this.paused) { this.time = t; return this; }
      this._advancing = true;
      try {
        for (;;) {

          const horizontalAt = this.active && direction ? Math.max(direction.nextAt, this.cutUntil) : Infinity;
          const fallAt = this.active ? this.fallAt : Infinity;
          const lockAt = this.active ? this.lockAt : Infinity;
          const at = Math.min(spawnAt, horizontalAt, fallAt, lockAt);
          if (at > t || at === Infinity) break;

          if (spawnAt === at) this._spawn(this.pending.type);
          else if (horizontalAt === at) this._horizontal(direction, true, true);
          else if (fallAt === at) this._fall(this._interval() === 0);
          else this._lock();

    }
    keyDown(action, t = this.clock(), options = {}) {
      if (!INPUT_ACTIONS.includes(action)) throw new RangeError('Unknown action: ' + action);
      this.update(t);

      if (options.repeat || this.held.has(code)) return false;
      if (action === 'pause') {
        this.held.set(code, { action, since: t, order: ++this.order, nextAt: Infinity });

      this.held.set(code, key);

      if (['retry', 'skip', 'settings', 'hint'].includes(action)) {

        if (this.callbacks.onAction) this.callbacks.onAction(action, t, this);
        if (action === 'left' || action === 'right') this._horizontal(key, false);
        else if (action in ROTATE_ACTIONS) {
          this._record(action, key);
          const next = rotatePiece(this.board, this.active, ROTATE_ACTIONS[action], this.settings);
          if (next) { this.active = next; this.lastMove = 'rotation'; this._grounded(true); this._cut(); this._wakeFall(); this._emit('rotate', { action, state: { ...next } }); }
        } else if (action === 'softDrop') {
          this._record(action, key);

    }
    keyUp(action, t = this.clock(), options = {}) {
      this.update(t);
      const before = this._direction(), interval = this._interval(), code = options.code || action;
      const key = this.held.get(code);
      if (!key || key.action !== action) return false;
      this.held.delete(code);
      const after = this._direction();
      const effectiveTime = this.paused ? this.pauseStarted : t;
      if (after && before !== after) after.nextAt = Math.max(effectiveTime, after.since + this.settings.das);
      if (this._interval() !== interval) this._resetFall();
      this.update(t); return true;
    }
    // Atomic focus/pause cleanup: sequential keyUp calls could wake an older
    // charged direction between releases. Also discard a released IHS ARE tap.
    releaseAll(t = this.clock()) {

    }
    setSettings(patch, t = this.clock()) {
      this.update(t);

      this.settings = normalizeSettings(patch, previous);
      // Only affected timers change. DAS/ARR edits preserve held-key age and
      // allow one charged repeat now, then use the new ARR (no backlog burst).
      // DCD/ARE keep their original trigger/start; elapsed deadlines fire now.
      // A changed fall rate starts a full interval now, or drops immediately.
      const effectiveTime = this.paused ? this.pauseStarted : t;
      if (this.settings.lockDelayOn !== previous.lockDelayOn || this.settings.lockDelay !== previous.lockDelay) {
        // Duration edits retain elapsed contact time and the reset budget.
        // Re-enabling starts a new contact timer without replenishing resets.
        if (this.lockDeadline !== Infinity) this.lockDeadline += this.settings.lockDelay - previous.lockDelay;
        this._grounded();
      }
      if (this.settings.das !== previous.das || this.settings.arr !== previous.arr) {
        for (const key of this.held.values()) key.nextAt = Math.max(effectiveTime, key.since + this.settings.das);
      }
      if (this.settings.dcd !== previous.dcd) this.cutUntil = Math.max(effectiveTime, this.cutAt + this.settings.dcd);
      if (this.pending && this.settings.are !== previous.are) this.pending.at = Math.max(effectiveTime, this.pending.since + this.settings.are);
      if (this._interval() !== interval) this._resetFall();

      for (const key of this.held.values()) { key.since += delta; key.nextAt += delta; }

      this.lockAt += delta; this.lockDeadline += delta;
      this.paused = false; this.pauseStarted = null;

    }
  }

  // Placement feedback, shared by practice and endless play; never persisted.
  const COMBO_MILESTONES = Object.freeze([5, 10, 20, 50]);
  class ComboTracker {
    constructor() { this.reset(); }
    reset() { this.count = 0; return this.snapshot(); }
    snapshot() {
      return { count: this.count, tier: COMBO_MILESTONES.filter(n => n <= this.count).at(-1) || 0 };
    }
    next(result) {
      if (!['perfect', 'fault', 'miss'].includes(result?.status)) throw new RangeError('Invalid combo result');
      this.count = result.status === 'perfect' ? this.count + 1 : 0;
      return { ...this.snapshot(), milestone: COMBO_MILESTONES.includes(this.count) ? this.count : 0 };
    }
  }

  function emptyCounters() {
    return { attempts: 0, placements: 0, perfect: 0, faults: 0, misses: 0,
      usedInputs: 0, optimalInputs: 0, softDropAttempts: 0 };
  }
  class Stats {
    constructor(saved) {
      Object.assign(this, emptyCounters(), { streak: 0, bestStreak: 0, skips: 0, retries: 0 });
      this.byPiece = Object.fromEntries(PIECE_TYPES.map(type => [type, emptyCounters()]));
      this.byTarget = Object.create(null); this.bestTimes = Object.create(null);
      if (saved) this._load(saved);
    }
    _load(saved) {
      const copyNumbers = (to, from) => {
        for (const key of Object.keys(to)) if (typeof to[key] === 'number' &&
          Number.isFinite(from[key]) && from[key] >= 0) to[key] = from[key];
      };
      copyNumbers(this, saved);
      for (const type of PIECE_TYPES) copyNumbers(this.byPiece[type], saved.byPiece?.[type] || {});
      for (const [key, value] of Object.entries(saved.byTarget || {})) {
        this.byTarget[key] = emptyCounters(); copyNumbers(this.byTarget[key], value || {});
      }
      for (const [length, time] of Object.entries(saved.bestTimes || {})) {
        if (/^[1-9]\d*$/.test(length) && Number.isFinite(time) && time >= 0) this.bestTimes[length] = time;
      }
    }
    record(result) {
      pieceType(result.type);
      if (!['perfect', 'fault', 'miss'].includes(result.status) ||
        !Number.isFinite(result.used) || result.used < 0 || !Number.isFinite(result.optimal) || result.optimal < 0) {
        throw new RangeError('Invalid result');
      }
      const key = result.type + ':' + result.targetKey;
      const target = this.byTarget[key] || (this.byTarget[key] = emptyCounters());
      for (const counter of [this, this.byPiece[result.type], target]) {
        counter.attempts++; counter[result.status === 'perfect' ? 'perfect' : result.status === 'fault' ? 'faults' : 'misses']++;
        if (result.status !== 'miss') counter.placements++;
        counter.usedInputs += result.used; counter.optimalInputs += result.optimal;
        if (result.flags?.softDrop) counter.softDropAttempts++;
      }
      this.streak = result.status === 'perfect' ? this.streak + 1 : 0;
      this.bestStreak = Math.max(this.bestStreak, this.streak);
      return this;
    }
    snapshot() {
      return { ...this.toJSON(), accuracy: this.attempts ? 100 * this.perfect / this.attempts : 0,
        averageInputs: this.attempts ? this.usedInputs / this.attempts : 0,
        averageOptimal: this.attempts ? this.optimalInputs / this.attempts : 0 };
    }
    toJSON() {
      const result = { version: 1 };
      for (const key of Object.keys(emptyCounters()).concat(['streak', 'bestStreak', 'skips', 'retries'])) result[key] = this[key];
      result.byPiece = Object.fromEntries(PIECE_TYPES.map(type => [type, { ...this.byPiece[type] }]));
      result.byTarget = Object.fromEntries(Object.entries(this.byTarget).map(([key, value]) => [key, { ...value }]));
      result.bestTimes = { ...this.bestTimes }; return result;
    }
    reset() { Object.assign(this, new Stats()); return this; }
  }

  // Shared session clock and input boundary. Pauses freeze every engine timer.
  class PlaySession {
    constructor(options) {
      this.clock = options.clock || defaultClock;
      this.onEvent = options.onEvent;
      this.startedAt = null; this.endedAt = null;
      this.pausedAt = null; this.pausedDuration = 0;
      this.running = false; this.lastResult = null;
      this.combo = new ComboTracker();
    }
    _emit(kind, data = {}) { if (this.onEvent) this.onEvent({ kind, ...data }, this); }
    _touch(t) { if (this.running && this.startedAt === null) this.startedAt = t; }
    pause(t = this.clock()) {
      this.update(t);
      if (this.running && this.pausedAt === null) { this.pausedAt = t; this.handler.pause(t); }
      return this;
    }
    resume(t = this.clock()) {
      this.update(t);
      if (this.pausedAt !== null) {
        if (this.startedAt !== null) this.pausedDuration += t - this.pausedAt;
        this.pausedAt = null; this.handler.resume(t);
      }
      return this;
    }
    update(t = this.clock()) { this.handler.update(t); return this; }
    keyDown(action, t = this.clock(), options) {
      if (!this.running) return false;
      return this.handler.keyDown(action, t, options);
    }
    keyUp(action, t = this.clock(), options) { return this.handler.keyUp(action, t, options); }
    elapsed(t = this.clock()) {
      return this.startedAt === null ? 0 : Math.max(0, (this.endedAt ?? this.pausedAt ?? t) - this.startedAt - this.pausedDuration);
    }
  }

  function judgePlacement(lock, optimal, correct = true) {
    const status = !correct ? 'miss' : !optimal ? 'unjudged' :
      lock.used === optimal.count ? 'perfect' : 'fault';
    return { ...lock, status, optimal: optimal?.count ?? null, targetKey: optimal?.key ?? null,
      targetCells: optimal?.cells.map(c => c.slice()) || [], optimalSequence: optimal?.sequence.slice() || [],
      extra: optimal ? Math.max(0, lock.used - optimal.count) : 0 };
  }

  // Endless, unfiltered seven-bag play. The solver judges against the board
  // BEFORE lock/clear. Deliberate descent/tucks outside its graph are unjudged.
  class FreeSession extends PlaySession {
    constructor(options = {}) {
      super(options);
      this.settings = this._settings(options.settings);
      this.rng = options.rng || (options.seed === undefined ? Math.random : createRNG(options.seed));
      this._reset(options.time ?? this.clock());
    }
    _settings(patch) {
      const settings = normalizeSettings(patch);
      // A zero-gravity training profile still gives normal falling play.
      if (!settings.gravity) settings.gravity = 1 / 60;
      return settings;
    }
    _reset(t) {
      this.bag = new Bag({ rng: this.rng });
      this.lines = 0; this.pieces = 0; this.gameOver = false; this.reason = null;
      this.startedAt = this.endedAt = this.pausedAt = null; this.pausedDuration = 0;
      this.running = false; this.lastResult = null; this.cueDrawPending = false; this.combo.reset();
      this.handler = new InputHandler({ clock: this.clock, time: t, settings: this.settings,
        bag: this.bag, autoNext: false,
        onLock: lock => this._onLock(lock),
        onCommand: (action, time) => {
          if (action === 'retry') this.restart(time);
          else if (action === 'pause') this.pausedAt === null ? this.pause(time) : this.resume(time);
          else if (action === 'settings') this._emit(action, { t: time });
        },
        onEvent: event => {
          if (event.kind === 'spawn') {
            this._touch(event.t);
            const queueDrawn = this.cueDrawPending || event.queueDrawn;
            this.cueDrawPending = false;
            this._emit('spawn', { ...event, queueDrawn, nextType: this.bag.peek(1)[0] });
          } else if (event.kind === 'blockout') this._gameOver('blockout', event.t);
          else this._emit(event.kind, event);
        }
      });
    }
    _schedule(t) {
      this.cueDrawPending = true;
      this.handler.scheduleSpawn(this.bag.next(), t, this.settings.are);
    }
    start(t = this.clock()) {
      if (this.running || this.endedAt !== null) throw new Error('Session already started');
      this.running = true; this._schedule(t); return this;
    }
    restart(t = this.clock()) {
      this.update(t); this._reset(t); this._emit('restart', { t }); return this.start(t);
    }
    _onLock(lock) {
      const board = this.handler.board;
      const optimal = finesseFor(lock.type, lock.cells, { board, ...this.settings });
      const result = judgePlacement(lock, optimal && lock.used >= optimal.count ? optimal : null);
      result.combo = result.status === 'unjudged' ? this.combo.reset() : this.combo.next(result);
      board.lock(lock.state);
      result.lines = board.clearLines(); this.lines += result.lines; this.pieces++;
      this.lastResult = result; this._emit('result', { result });
      if (lock.cells.every(([, y]) => y >= VISIBLE_HEIGHT)) this._gameOver('lockout', lock.t);
      else this._schedule(lock.t);
    }
    _gameOver(reason, t) {
      this.running = false; this.gameOver = true; this.reason = reason; this.endedAt = t;
      this.cueDrawPending = false;
      this.handler.active = this.handler.pending = null;
      this.handler.fallAt = this.handler.lockAt = Infinity;
      this.handler.held.clear(); this.handler.initialHoldBuffered = false;
      this._emit('gameover', { t, reason });
    }
    setSettings(patch, t = this.clock()) {
      this.update(t); this.settings = this._settings({ ...this.settings, ...patch });
      this.handler.setSettings(this.settings, t); return this;
    }
    nextQueue(count = 5) {
      return this.handler.pending ? [this.handler.pending.type].concat(this.bag.peek(Math.max(0, count - 1))).slice(0, count) : this.bag.peek(count);
    }
    snapshot(t = this.clock()) {
      const elapsed = this.elapsed(t);
      return { lines: this.lines, pieces: this.pieces, elapsed, pps: elapsed ? this.pieces * 1000 / elapsed : 0,
        running: this.running, gameOver: this.gameOver, reason: this.reason };
    }
  }

  /* DrillSession keeps an empty practice board for every attempt. No lines
   * accumulate. It exposes round/target during ARE and nextQueue(5) for UI.
   * Column filters constrain the occupied LEFT column (inclusive); area aliases
   * left/center/right mean 0..2 / 3..5 / 6..9, clipped to legal placements.
   * Piece choice uses filtered bags; targets are uniform over distinct cell
   * sets, or optionally weighted by a smoothed per-target fault/miss rate.
   * Accuracy = perfect / all lock attempts (misses are separate from faults).
   * Sprint progress counts correct placements, excluding zero-fault resets.
   * Retry/skip/hold are not lock attempts; hold is disabled for one-piece bags.
   * Timer starts on first gameplay input, including IRS/HD/IHS; pauses excluded.
   * Persistence is data-only via Stats.toJSON(); storage belongs to the UI.
   */
  class DrillSession extends PlaySession {
    constructor(options = {}) {
      super(options);
      this.pieces = normalizePieces(options.pieces);
      this.settings = normalizeSettings(options.settings);
      this.rng = options.rng || (options.seed === undefined ? Math.random : createRNG(options.seed));
      this.bag = new Bag({ rng: this.rng, pieces: this.pieces });
      this.boardTemplate = options.board ? options.board.clone() : new Board();
      this.area = options.area || 'all';
      if (!['all', 'left', 'center', 'right'].includes(this.area)) throw new RangeError('Unknown area');
      this.columnRange = options.columnRange || null;
      if (this.columnRange && (this.columnRange.length !== 2 || !this.columnRange.every(Number.isInteger) ||
        this.columnRange[0] > this.columnRange[1])) throw new RangeError('Invalid column range');
      this.weakSpot = !!options.weakSpot;
      this.zeroFault = !!options.zeroFault; this.repeatOnFault = !!options.repeatOnFault;
      this.repeatOnMiss = options.repeatOnMiss !== false;
      this.sprintLength = options.sprintLength || 0;
      if (!Number.isInteger(this.sprintLength) || this.sprintLength < 0) throw new RangeError('Invalid sprint length');
      this.stats = new Stats();
      this.totalStats = options.totalStats instanceof Stats ? options.totalStats : new Stats(options.totalStats);
      this.completed = 0; this.round = null; this.serial = 0;
      this.cueDrawPending = false;
      this.handler = new InputHandler({ clock: this.clock, time: options.time, settings: this.settings,
        board: this.boardTemplate.clone(), bag: this.bag, autoNext: false,
        holdEnabled: this.pieces.length > 1,
        onInput: () => this._touch(this.handler.time),
        onAction: (action, t) => this._touch(t),
        onHold: event => {
          this._touch(event.t); this.stats.skips++; this.totalStats.skips++;
          this._newRound(event.to); this.handler.board = this.boardTemplate.clone();
        },
        onLock: result => this._onLock(result),

   */
  function hintText(piece, used, optimal, optimalSeqLabels) {
    if (!engine.PIECE_TYPES.includes(piece)) throw new RangeError('Unknown piece: ' + piece);
    if (![used, optimal].every(n => Number.isInteger(n) && n >= 0) ||
      !Array.isArray(optimalSeqLabels) || !optimalSeqLabels.every(s => typeof s === 'string') ||
      optimalSeqLabels.length !== optimal) throw new RangeError('Invalid finesse hint');
    const route = optimal === 0 ? '移動も回転もいらない。ハードドロップだけ。'
      : `${optimalSeqLabels.join(' → ')}。最後はハードドロップ。`;
    const extra = Math.max(0, used - optimal);
    return `…${piece}ミノ、今の${used}回。最短は${optimal}回。${extra ? `${extra}回多い。遠回りしないで。` : '道順を確認して。'}\n${route}`;
  }
  function sprintComment(accuracy, pps) {
    if (!Number.isFinite(accuracy) || accuracy < 0 || accuracy > 100 || !Number.isFinite(pps) || pps < 0) {
      throw new RangeError('Accuracy must be 0..100 and PPS must be nonnegative');
    }
    return SPRINT_COMMENTS.accuracy.find(tier => accuracy >= tier.min).text +
      ' ' + SPRINT_COMMENTS.pps.find(tier => pps >= tier.min).text;
  }

  /** All DISTINCT empty-board landings grouped by the engine's canonical
   * optimal action sequence, including [] (no movement). x is zero-based
   * occupied-left-column, column is its one-based display equivalent. Symmetric
   * rotations share a cell set and appear exactly once. No handwritten table.
   * Pass {allow180:false} when the app disables 180; default matches the engine.
   * The result is fresh mutable data, isolated from engine and lesson caches.
   */
  function lessonPlacementGroups(piece, opts = {}) {
    const groups = new Map();
    for (const placement of engine.allPlacements(piece, { allow180: opts.allow180 !== false })) {
      const signature = JSON.stringify(placement.actions);
      if (!groups.has(signature)) groups.set(signature, {
        id: piece + '-' + (placement.actions.join('-') || 'drop'), piece,
        count: placement.count, actions: placement.actions.slice(), sequence: placement.sequence.slice(),
        label: placement.sequence.length ? placement.sequence.join(' → ') : 'そのままハードドロップ',
        placements: []
      });
      groups.get(signature).placements.push({ ...placement, column: placement.x + 1,
        rotationLabel: engine.ROTATIONS[placement.rot],
        label: `${engine.ROTATIONS[placement.rot]}向き・左から${placement.x + 1}列目` });
    }
    return Array.from(groups.values()).sort((a, b) => a.count - b.count ||
      (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
  }

  const UI_NUMERIC = { volume: [0, 1, .05], pieceCueVolume: [0, 100, 1] };

  // Match native range step rounding (ties toward the higher value). Clamp
  // before rounding, and remove floating point noise from decimal steps.
  function snapNumeric(value, min, max, step) {
    const bounded = Math.max(min, Math.min(max, value));
    const ticks = Math.round(Number(((bounded - min) / step).toFixed(10)));
    return Math.max(min, Math.min(max, Number((min + ticks * step).toFixed(10))));
  }

      // Buttons retain native Enter/Space activation after Tab navigation. The
      // initial prompt itself captures Enter/Space so either can be rebound.
      if (event.target.closest?.('button') && ['Enter', 'Space'].includes(event.code)) return;
      event.preventDefault(); if (!event.repeat) acceptKey(event.code); return;
    }
    if (numericEditor(event.target) && event.code === 'Enter') {
      event.preventDefault(); commitNumeric(event.target);
      if (event.target.closest?.('[data-live-handling]')) { event.target.blur(); $('#board')?.focus({ preventScroll: true }); }
      return;
    }
    const action = Object.keys(bindings).find(name => bindings[name].includes(event.code));
    // Also guard programmatic/assistive focus on these pointer-only buttons:
    // bound keys, arrows and Space belong to play, never native activation.
    if ((event.target.dataset?.setting || event.target.dataset?.engineToggle) && event.target.closest?.('[data-live-handling]')) {
      if (['Escape', 'Enter'].includes(event.code)) { event.preventDefault(); event.target.blur(); $('#board')?.focus({ preventScroll: true }); }
      return;
    }
    const onHandling = !!event.target.closest?.('[data-live-handling]')?.hasAttribute?.('data-live-handling');
    if (onHandling) {
      $('#board')?.focus({ preventScroll: true });
      if (action || event.code.startsWith('Arrow') || ['Space', 'Enter'].includes(event.code)) event.preventDefault();
    }
    const onBoard = onHandling || event.target === $('#board') || event.target === document.body || event.target === document;
    if (screen === 'dressup') {
      if(event.code === 'Escape') { event.preventDefault(); if(!event.repeat) closeDressup(); }
      return;
    }
    if (screen === 'settings') {
      if (event.code === 'Escape') { event.preventDefault(); if (!event.repeat) closeSettings(); }
      return;
    }
    if (screen === 'tutorial' && event.code === 'Escape') { event.preventDefault(); if (!event.repeat) go('menu'); return; }
    const overlay = $('.overlay');
    if (overlay) {
      if (isFree() && session.gameOver) {
        // Cancel native button activation too, including Space held at top-out.
        if (event.repeat || now() < gameOverInputUntil && (['Enter', 'Space'].includes(event.code) || action === 'retry')) {
          event.preventDefault(); return;
        }
        if (event.target.closest?.('button') && ['Enter', 'Space'].includes(event.code)) return;
        if (action === 'retry') { event.preventDefault(); if (!event.repeat) restartFree(); }
        else if (event.code === 'Escape') { event.preventDefault(); if (!event.repeat) go('menu'); }
        else navigateDialog(event, overlay);
        return;
      }
      if (event.code === 'Escape') { event.preventDefault(); if (!event.repeat) resumePlay(); }
      else if (event.target.closest?.('button') && ['Enter', 'Space'].includes(event.code)) return;
      else if (action === 'pause') { event.preventDefault(); if (!event.repeat) resumePlay(); }
      else if (action === 'settings') { event.preventDefault(); if (!event.repeat) openSettings(); }
      else navigateDialog(event, overlay);
      return;
    }
    // Respect an explicit gameplay rebind of Escape on board. In native UI,
    // Escape always closes the editor/overlay or pauses the current drill.
    if (screen === 'play' && event.code === 'Escape' && (!onBoard || !action || action === 'pause')) {
      event.preventDefault(); if (!event.repeat) { pauseSession(); processEvents(); showPause(); } return;
    }
    if (event.code === 'Escape' && !['menu', 'play', 'tutorial'].includes(screen)) {
      event.preventDefault(); if (!event.repeat) go('menu'); return;
    }
    if (editable(event.target)) return;
    const buttonActivation = !onHandling && event.target.closest?.('button') && ['Enter', 'Space'].includes(event.code);
    if ((screen === 'play' || screen === 'tutorial' && tryMode) && session && !buttonActivation) {
      // Shift+Tab always reaches native controls. Arrow keys navigate controls while
      // the board is unfocused; gameplay shortcuts use their bindings on board.
      if ((event.code !== 'Tab' || onBoard && !event.shiftKey) && (onBoard || !event.code.startsWith('Arrow')) && action) {
        event.preventDefault(); if (event.repeat) return;
        if (action === 'settings') { openSettings(); return; }
        if (session.pausedAt !== null) return;
        if (screen === 'tutorial' && action === 'skip') { choosePracticeTarget(); processEvents(); return; }
        session.keyDown(action, now(), { code: event.code }); processEvents(); return;
      }
    }
    if (screen === 'tutorial' && !tryMode && onBoard) {
      if (['ArrowRight', 'Enter', 'Space'].includes(event.code)) { event.preventDefault(); if (!event.repeat) lessonIndex === 11 ? startPlay() : startLesson(lessonIndex + 1); return; }
      if (event.code === 'ArrowLeft') { event.preventDefault(); if (!event.repeat) startLesson(lessonIndex - 1); return; }
    }
    if (action === 'settings') { event.preventDefault(); if (!event.repeat) openSettings(); return; }
    // During play, unbound arrows/Space/Enter on the board do nothing: they
    // must not walk focus onto a button that the next Space would press.
    if ((screen === 'play' || screen === 'tutorial' && tryMode) && session && onBoard &&
      (event.code.startsWith('Arrow') || ['Space', 'Enter'].includes(event.code))) { event.preventDefault(); return; }
    if (['ArrowDown', 'ArrowUp', 'ArrowLeft', 'ArrowRight'].includes(event.code)) {
      const buttons = $$('button:not(:disabled)', $('main')).filter(el => el.offsetParent !== null);
      if (!buttons.length) return;
      event.preventDefault();
      const direction = ['ArrowDown', 'ArrowRight'].includes(event.code) ? 1 : -1;
      const index = buttons.indexOf(document.activeElement);
      const next = buttons[(index + direction + buttons.length) % buttons.length];
      next.focus();
    }
  });
  document.addEventListener('keyup', event => {
    if (!session) return;
    const held = session.handler.held.get(event.code);
    if (held) { event.preventDefault(); session.keyUp(held.action, now(), { code: event.code }); processEvents(); }
  });
  function blur() {
    // Freeze first, then release: releasing a newer direction cannot resume an
    // older charged direction beneath a pause overlay.
    if (session?.running) { pauseSession(); processEvents(); showPause(); }
    else releaseAll();
    save();
  }
  window.addEventListener('blur', blur);
  document.addEventListener('visibilitychange', () => { if (document.hidden) blur(); });
  let frameId = 0;
  function startFrames() { if (!frameId) frameId = requestAnimationFrame(frame); }
  window.addEventListener('pagehide', () => { blur(); cancelAnimationFrame(frameId); frameId = 0; });
  window.addEventListener('pageshow', startFrames);
  window.addEventListener('resize', () => { fitLessonBoard(); drawMinis(); });
  function frame() {
    frameId = 0;
    const t = now();
    if (screen === 'play' || screen === 'tutorial' && tryMode) { session?.update(t); processEvents(); }
    if (screen === 'tutorial' && !tryMode) updateDemo(t);
    if (screen === 'play' || screen === 'tutorial') renderBoard(t);
    if (screen === 'play' && t - lastHUD > 90) {
      lastHUD = t; updateHUD(t);
      const attempts = session.stats?.attempts;
      if (!isSpin() && attempts && attempts % 7 === 0 && attempts !== lastTipAttempt && t - feedbackAt > 3200) {
        lastTipAttempt = attempts; setCoach(M.TIPS[tipIndex++ % M.TIPS.length], 'normal');
      }
    }
    if (toastUntil && t >= toastUntil) dismissToast();
    startFrames();
  }

  // Public, serializable browser-test seam. Gameplay is always driven by normal
  // KeyboardEvent dispatch or page.keyboard; no helper changes counts/results.
  window.__mirutet = Object.freeze({
    getState() {
      const handler = screen === 'tutorial' && !tryMode ? demo?.handler : session?.handler;
      return copy({ screen, menuMode, mode: session ? isFree() ? 'free' : isSpin() ? 'spin' : 'finesse' : null, settings, ui, bindings, practice, progress, spinProgress, spinStats: spinStats.snapshot(), lessonIndex, tryMode, tryIndex, tryDone,
        expression, bubble, irsCount, storageOK, hint, lastResult, trace, combo: session?.combo.snapshot(),
        round: session?.round, stats: session?.snapshot(), totalStats: totalStats.snapshot(),
        active: handler?.active, pending: handler?.pending, inputs: handler?.inputs, inputCount: handler?.inputCount,
        held: handler ? [...handler.held.keys()] : [], heldPiece: handler?.heldPiece, flags: handler?.flags, lastMove: handler?.lastMove,
        paused: session?.pausedAt !== null && !!session,
        demo: demo ? { type: demo.variant.type, actions: demo.actions, target: demo.target } : null, sprintResult });
    },
    chooseTarget(type, target, { delay } = {}) {
      if (!session?.running || isFree() || isSpin() || session.pausedAt !== null) throw new Error('Open a running drill first');
      const optimal = E.finesseFor(type, target, session.settings);
      if (!optimal) throw new Error('Unreachable debug target');
      releaseAll(); session._newRound(type, optimal); session.handler.board = session.boardTemplate.clone();
      session.handler.scheduleSpawn(type, now(), delay ?? session.settings.are); processEvents();
      $('#board')?.focus({ preventScroll: true }); return copy(optimal);
    },
    dispatch(code, down = true) { document.dispatchEvent(new KeyboardEvent(down ? 'keydown' : 'keyup', { code, bubbles: true, cancelable: true })); },
    storageKey: STORAGE
  });
  render(); startFrames();
})();
</script>
</body>
</html>
