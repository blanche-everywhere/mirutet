  <title>ミルテト フィネス編</title>
  <style>
.mirufi { display: block; max-width: 100%; height: auto; overflow: hidden;
  --mirufi-sway: .7deg; --mirufi-sway-time: 4.8s; }
.mirufi--happy { --mirufi-sway: 1.4deg; --mirufi-sway-time: 3s; }
.mirufi--surprised { --mirufi-sway: 1.1deg; --mirufi-sway-time: 2.6s; }
.mirufi--thinking { --mirufi-sway: .5deg; --mirufi-sway-time: 5.6s; }
.mirufi--sorry { --mirufi-sway: .65deg; --mirufi-sway-time: 5s; }
.mirufi .mirufi-eyes-closed { opacity: 0; }
.mirufi--animated .mirufi-bob { animation: mirufi-bob 4s ease-in-out infinite; }
.mirufi--animated .mirufi-tail--left { transform-origin: 68px 110px;
  animation: mirufi-sway-left var(--mirufi-sway-time) ease-in-out infinite; }
.mirufi--animated .mirufi-tail--right { transform-origin: 232px 110px;
  animation: mirufi-sway-right var(--mirufi-sway-time) ease-in-out infinite; }
.mirufi--animated .mirufi-eyes-open { animation: mirufi-open 5.7s steps(1, end) infinite; }
.mirufi--animated .mirufi-eyes-closed { animation: mirufi-blink 5.7s steps(1, end) infinite; }
.mirufi--animated .mirufi-sparkle { transform-box: fill-box; transform-origin: center;
  animation: mirufi-twinkle 3.2s ease-in-out infinite; }
.mirufi--animated .mirufi-sparkle:nth-child(even) { animation-delay: -1.6s; }
@keyframes mirufi-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes mirufi-sway-left { 0%, 100% { transform: rotate(calc(-1 * var(--mirufi-sway))); }
  50% { transform: rotate(var(--mirufi-sway)); } }
@keyframes mirufi-sway-right { 0%, 100% { transform: rotate(var(--mirufi-sway)); }
  50% { transform: rotate(calc(-1 * var(--mirufi-sway))); } }
@keyframes mirufi-open { 0%, 43%, 46%, 100% { opacity: 1; } 44%, 45% { opacity: 0; } }
@keyframes mirufi-blink { 0%, 43%, 46%, 100% { opacity: 0; } 44%, 45% { opacity: 1; } }
@keyframes mirufi-twinkle { 0%, 100% { opacity: .5; transform: scale(.88); }
  50% { opacity: 1; transform: scale(1.08); } }
@media (prefers-reduced-motion: reduce) {
  .mirufi--animated .mirufi-bob, .mirufi--animated .mirufi-eyes-open,
  .mirufi--animated .mirufi-eyes-closed, .mirufi--animated .mirufi-sparkle,
  .mirufi--animated .mirufi-tail--left, .mirufi--animated .mirufi-tail--right { animation: none; }
  .mirufi .mirufi-eyes-open { opacity: 1; }
  .mirufi .mirufi-eyes-closed { opacity: 0; }
}
:root {
  --ink:#49445e;
  --muted:#8c849e;
  --pink:#e58ba9;
  --purple:#9a82c8;
  --mint:#77bcab;
  --line:#e9e1f0;
  --paper:#fffdfefa;
  --shadow:0 8px 30px #72588d0a;
  --cell:min(24px,calc((100vh - 236px)/22));
  font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo","Noto Sans CJK JP",sans-serif;
  color:var(--ink);
  font-size:14px;
  font-synthesis:none
}

* {
  box-sizing:border-box
}

body {
  margin:0;
  min-width:1000px;
  background:radial-gradient(ellipse at 8% 4%,#fcebf2 0,transparent 42%),radial-gradient(ellipse at 90% 80%,#eaf6f2 0,transparent 45%),#f8f5fc
}

button,input,select,textarea {
  font:inherit;
  color:inherit
}

button {
  cursor:pointer;
  border:1px solid var(--line);
  background:#fff;
  border-radius:12px;
  padding:10px 15px;
  transition:background .15s,transform .15s,box-shadow .15s
}

button:hover {
  background:#f6f0fc;
  border-color:#d2bfe7;
  transform:translateY(-1px)
}

button:active {
  transform:translateY(1px)
}

button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible {
  outline:3px solid #b6a0da;
  outline-offset:3px
}

button:disabled {
  opacity:.42;
  cursor:default;
  transform:none
}

.primary {
  color:#fff;
  background:linear-gradient(125deg,#bd9cda,#a48aca);
  border-color:transparent;
  box-shadow:0 5px 14px #a183c52d
}

.primary:hover {
  background:#a086c2
}

.pink {
  background:#fbedf3;
  color:#b86f8b;
  border-color:#efd4df
}

.quiet {
  background:transparent;
  border-color:transparent
}

.small {
  font-size:13px;
  padding:7px 11px;
  border-radius:9px
}

.danger {
  color:#bc7288
}

.eyebrow {
  font-size:13px;
  letter-spacing:.2em;
  font-weight:800;
  color:#a38ab9;
  text-transform:uppercase
}

.muted {
  color:var(--muted)
}

.tiny {
  font-size:13px;
  color:var(--muted)
}

h1,h2,h3,p {
  margin:0
}

h2 {
  font-size:23px;
  letter-spacing:.04em
}

h3 {
  font-size:14px
}

.row {
  display:flex;
  align-items:center;
  gap:10px
}

.spread {
  justify-content:space-between
}

.stack {
  display:grid;
  gap:14px
}

.panel {
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:var(--shadow);
  padding:18px
}

.tag {
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:#f0eaf8;
  border:1px solid #e7dff0;
  color:#9278b3;
  border-radius:30px;
  padding:4px 9px;
  font-size:13px;
  letter-spacing:.06em
}

.mint-tag {
  color:#5b9e8e;
  background:#e9f5ef;
  border-color:#d2eade
}

.topbar {
  height:72px;
  padding:0 34px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #e9e1f0aa;
  background:#fffc;
  gap:20px
}

.brand {
  display:flex;
  gap:11px;
  align-items:center;
  font-weight:800;
  letter-spacing:.08em
}

.brand-button {
  border:0;
  background:none;
  padding:0
}

.brand-mark {
  display:grid;
  grid-template-columns:repeat(3,8px);
  grid-template-rows:repeat(2,8px);
  gap:2px;
  transform:rotate(-7deg)
}

.brand-mark i {
  background:#b6a1d4;
  border-radius:2px
}

.brand-mark i:first-child {
  grid-column:2;
  background:#e7adc2
}

.brand small {
  display:block;
  font-size:13px;
  letter-spacing:.23em;
  font-weight:500;
  color:#a197ae;
  margin-top:3px
}

.top-actions {
  display:flex;
  gap:10px;
  align-items:center
}

.page {
  max-width:1140px;
  margin:auto;
  padding:28px 18px
}

.page-heading {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px
}

.page-heading p {
  margin-top:7px;
  color:var(--muted);
  font-size:13px
}

.footer {
  font-size:13px;
  color:#a69bb2;
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:15px 34px;
  letter-spacing:.04em
}

kbd {
  font-family:inherit;
  font-size:13px;
  font-weight:600;
  line-height:1.2;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:27px;
  min-height:26px;
  padding:4px 7px;
  border:1px solid #dfd5eb;
  border-bottom:3px solid #d9cde7;
  border-radius:6px;
  background:#fff;
  color:#7c668f;
  white-space:nowrap
}

kbd.pressed {
  background:#b498d0;
  color:#fff;
  border-color:#a284c2;
  transform:translateY(2px);
  box-shadow:0 0 13px #c3a6e680
}

.sequence {
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  align-items:center;
  min-height:30px
}

.sequence .arrow {
  color:#c7bbd2;
  font-size:13px
}

.sequence small {
  font-size:13px;
  margin-left:4px;
  color:#b48ac0
}

.empty-route {
  font-size:13px;
  color:var(--muted)
}

/* Title screen */
.menu {
  max-width:1080px;
  min-height:calc(100vh - 116px);
  margin:auto;
  display:grid;
  grid-template-columns:1.05fr 1fr;
  gap:58px;
  align-items:center;
  padding:32px
}

.menu-copy .eyebrow {
  display:flex;
  align-items:center;
  gap:10px
}

.menu-copy .eyebrow:before {
  content:"";
  width:22px;
  height:1px;
  background:#cdb7df
}

.logo {
  font-weight:900;
  line-height:1.17;
  font-size:66px;
  letter-spacing:.04em;
  margin:22px 0 15px;
  color:#a783bd;
  text-shadow:2px 3px 0 #fff
}

.logo span {
  color:#db93af
}

.logo small {
  display:block;
  font-size:30px;
  letter-spacing:.18em;
  margin-top:9px;
  color:#776787
}

.menu-intro {
  line-height:2;
  color:#93849f;
  font-size:13px;
  margin-bottom:26px
}

.menu-buttons {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px
}

.menu-buttons button {
  text-align:left;
  min-height:62px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:13px 17px
}

.menu-buttons button:first-child {
  grid-column:1/-1
}

.menu-buttons button b {
  display:block;
  font-size:14px;
  letter-spacing:.04em
}

.menu-buttons button small {
  display:block;
  font-size:13px;
  font-weight:400;
  letter-spacing:.03em;
  opacity:.7;
  margin-top:4px
}

.menu-buttons .button-arrow {
  opacity:.65;
  font-size:20px
}

.first-note {
  margin-top:15px;
  font-size:13px;
  color:#ac8cb4;
  display:flex;
  align-items:center;
  gap:8px
}

.menu-art {
  position:relative;
  text-align:center
}

.menu-art:before {
  content:"";
  position:absolute;
  inset:40px -10px 65px;
  border-radius:50%;
  background:radial-gradient(circle,#f0e6f7 0,#f9f5fc00 70%)
}

.menu-art .mascot-wrap {
  max-width:370px;
  margin:auto;
  position:relative
}

.speech {
  background:#fff;
  border:1px solid #e7dbee;
  border-radius:18px;
  padding:17px 19px;
  line-height:1.9;
  font-size:13px;
  position:relative;
  box-shadow:0 5px 20px #9c7baa0a
}

.speech:after {
  content:"";
  position:absolute;
  bottom:-7px;
  left:50%;
  height:12px;
  width:12px;
  background:#fff;
  border-right:1px solid #e7dbee;
  border-bottom:1px solid #e7dbee;
  transform:rotate(45deg)
}

.speaker {
  display:block;
  font-size:13px;
  font-weight:800;
  letter-spacing:.03em;
  color:#ad88bc;
  margin-bottom:5px
}

.menu-art .speech {
  max-width:340px;
  margin:0 auto 8px;
  text-align:left;
  z-index:1
}

.mascot-caption {
  font-size:13px;
  color:#ad9cb7;
  letter-spacing:.15em;
  margin-top:10px
}

.float-block {
  position:absolute;
  width:19px;
  height:19px;
  border-radius:5px;
  background:#edc6d5;
  box-shadow:21px 0 #edc6d5,21px -21px #edc6d5,42px -21px #edc6d5;
  transform:rotate(13deg);
  left:17px;
  top:46%;
  opacity:.6
}

.float-block.two {
  left:auto;
  right:32px;
  top:67%;
  background:#bce3d6;
  box-shadow:21px 0 #bce3d6,-21px 0 #bce3d6,0 -21px #bce3d6;
  transform:rotate(-15deg)
}

/* Training workspace: all three columns fit at 1280 x 720. */
.play-page {
  padding:17px 28px 0;
  max-width:1260px;
  margin:auto
}

.play-topline {
  height:30px;
  margin-bottom:12px
}

.play-title {
  font-size:17px;
  display:flex;
  align-items:center;
  gap:10px
}

.play-grid {
  display:grid;
  grid-template-columns:minmax(220px,1fr) 428px minmax(230px,1fr);
  gap:22px;
  align-items:start;
  height:calc(100vh - 166px)
}

.coach {
  display:flex;
  flex-direction:column;
  gap:12px;
  height:100%;
  min-height:0
}

.coach .speech {
  min-height:116px;
  font-size:13px
}

.coach .mascot-wrap {
  width:200px;
  max-height:234px;
  margin:0 auto;
  flex:1;
  min-height:120px
}

.coach .mirufi {
  height:100%;
  width:100%;
  max-height:240px
}

.coach .speaker {
  font-size:13px
}

.coach-label {
  text-align:center;
  font-size:13px;
  color:#a293ae;
  letter-spacing:.12em;
  margin-top:-14px
}

.practice-options {
  padding:13px 15px
}

.practice-options h3 {
  font-size:13px;
  color:#887794;
  margin-bottom:10px
}

.piece-filters {
  display:flex;
  gap:5px;
  flex-wrap:wrap
}

.piece-check input {
  position:absolute;
  opacity:0
}

.piece-check span {
  display:inline-flex;
  width:27px;
  height:27px;
  align-items:center;
  justify-content:center;
  border-radius:7px;
  border:1px solid var(--line);
  font-size:13px;
  cursor:pointer;
  color:#c4bbca
}

.piece-check input:checked+span {
  background:#f0eaf8;
  border-color:#cbb7df;
  color:#79618c;
  font-weight:800
}

.piece-check input:focus-visible+span {
  outline:2px solid #aa8fc7
}

.filter-line {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:5px;
  margin-top:9px;
  font-size:13px
}

.filter-line select {
  width:120px;
  padding:4px;
  border-radius:6px;
  border:1px solid var(--line);
  background:#fff
}

.filter-line input[type=number] {
  width:45px;
  padding:3px
}

.checkline {
  display:flex;
  align-items:center;
  gap:7px;
  font-size:13px;
  line-height:1.7
}

.checkline input {
  accent-color:#aa89c9
}

.filter-error {
  font-size:13px;
  color:#b35e7a;
  margin-top:6px
}

.board-stage {
  display:grid;
  grid-template-columns:76px calc(var(--cell)*10) 76px;
  gap:12px;
  justify-content:center
}

.board-column {
  position:relative
}

.board-heading {
  height:25px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:13px;
  color:#a18eaf;
  letter-spacing:.03em
}

.board-shell {
  position:relative;
  border-radius:10px;
  overflow:hidden;
  border:1px solid #d8cde5;
  box-shadow:0 6px 24px #8a6da716;
  background:#faf9fd;
  width:calc(var(--cell)*10 + 2px);
  height:calc(var(--cell)*22 + 2px)
}

canvas.board {
  display:block;
  width:calc(var(--cell)*10);
  height:calc(var(--cell)*22)
}

.column-labels {
  display:grid;
  grid-template-columns:repeat(10,1fr);
  font-size:13px;
  text-align:center;
  color:#b6a9c0;
  padding-top:7px
}

.board-note {
  text-align:center;
  font-size:13px;
  color:#b4a3bf;
  margin-top:8px
}

.side-queue {
  padding-top:25px
}

.queue-box {
  background:#fffc;
  border:1px solid #e8dff0;
  border-radius:12px;
  overflow:hidden;
  text-align:center
}

.queue-title {
  font-size:13px;
  letter-spacing:.03em;
  color:#a18daf;
  padding:10px 0 3px
}

.mini-piece {
  display:block;
  width:72px;
  height:54px;
  margin:auto
}

.queue-box .mini-piece+.mini-piece {
  border-top:1px solid #f2edf6
}

.hold-note {
  font-size:13px;
  line-height:1.7;
  color:#ac9cb5;
  margin-top:9px;
  text-align:center
}

.key-help {
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:17px;
  justify-content:center
}

.key-help kbd {
  font-size:13px;
  min-width:25px;
  padding:3px;
  min-height:22px
}

.irs-flash {
  position:absolute;
  top:47px;
  left:50%;
  transform:translateX(-50%);
  background:#a485c9e8;
  color:#fff;
  font-size:13px;
  border-radius:20px;
  padding:5px 15px;
  letter-spacing:.18em;
  opacity:0;
  transition:opacity .12s;
  pointer-events:none
}

.irs-flash.visible {
  opacity:1
}

.are-track {
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:3px;
  background:#e7def1;
  opacity:0
}

.are-track.visible {
  opacity:1
}

.are-fill {
  height:100%;
  background:#b396ce;
  width:0
}

.right-stack {
  display:grid;
  gap:12px
}

.stats-panel {
  padding:16px
}

.panel-label {
  font-size:13px;
  letter-spacing:.03em;
  color:#9e8eaa;
  font-weight:700;
  margin-bottom:12px
}

.stats-main {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.stat strong {
  font-size:27px;
  font-weight:600;
  letter-spacing:-.04em;
  line-height:1.2
}

.stat strong.accent {
  color:#b88bca
}

.stat small {
  font-size:13px;
  color:#ab9eb6
}

.stat label {
  display:block;
  font-size:13px;
  color:#a496af;
  margin-bottom:4px
}

.stats-strip {
  border-top:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  margin-top:13px;
  padding-top:10px;
  font-size:13px;
  color:#9d8da9
}

.stats-strip b {
  color:#74627e;
  font-weight:600
}

.piece-bars {
  display:grid;
  gap:5px
}

.piece-bar {
  display:grid;
  grid-template-columns:12px 1fr 42px;
  gap:8px;
  font-size:13px;
  align-items:center
}

.bar-track {
  height:5px;
  background:#f0ebf5;
  border-radius:5px;
  overflow:hidden
}

.bar-fill {
  height:100%;
  border-radius:5px;
  background:#d6b2c6
}

.piece-bar span:last-child {
  text-align:right;
  color:#a89ab1
}

.result-panel {
  padding:16px;
  min-height:168px
}

.result-panel.perfect {
  border-color:#cee6dc;
  background:#fbfffd
}

.result-panel.fault {
  border-color:#eccbd9;
  background:#fffafc
}

.result-panel.miss {
  border-color:#e8d9bc
}

.result-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px
}

.result-head strong {
  font-size:17px;
  color:#9f83b7
}

.perfect .result-head strong {
  color:#6ca995
}

.fault .result-head strong {
  color:#ce8ba6
}

.result-head small {
  font-size:13px;
  color:#a193ac
}

.route-label {
  font-size:13px;
  letter-spacing:.08em;
  color:#a496b0;
  margin:9px 0 4px
}

.play-buttons {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}

.play-buttons button {
  font-size:13px;
  padding:9px 5px
}

.hint-route {
  margin-top:10px;
  border-top:1px dashed #e2d6eb;
  padding-top:7px
}

.play-footer {
  height:35px;
  padding-top:11px;
  font-size:13px;
  color:#ac9db8;
  text-align:center;
  letter-spacing:.04em
}

.sprint-progress {
  height:4px;
  background:#eadff1;
  border-radius:4px;
  margin-top:10px;
  overflow:hidden
}

.sprint-progress div {
  height:100%;
  background:#b298cf
}

.sprint-time {
  font-variant-numeric:tabular-nums;
  color:#9c7eaf;
  font-weight:700;
  font-size:20px

  animation: mirufi-sway-left var(--mirufi-sway-time) ease-in-out infinite; }

  animation: mirufi-sway-right var(--mirufi-sway-time) ease-in-out infinite; }

.mirufi--animated .mirufi-eyes-closed { animation: mirufi-blink 5.7s steps(1, end) infinite; }

  50% { transform: rotate(calc(-1 * var(--mirufi-sway))); } }

@keyframes mirufi-blink { 0%, 43%, 46%, 100% { opacity: 0; } 44%, 45% { opacity: 1; } }

  50% { opacity: 1; transform: scale(1.08); } }

    ],

      { min: 2, text: 'すいすい進む速さでしたね！手を休める時間も大切ですよ。' },
      { min: 1, text: 'いいテンポです♪ このリズムで正確さも育てていきましょう。' },

  /** Plain text only: render with textContent, then render key caps separately
   * from the engine's action IDs using the player's current bindings.
   */
  function hintText(piece, used, optimal, optimalSeqLabels) {
    if (!engine.PIECE_TYPES.includes(piece)) throw new RangeError('Unknown piece: ' + piece);
    if (![used, optimal].every(n => Number.isInteger(n) && n >= 0) ||
      !Array.isArray(optimalSeqLabels) || !optimalSeqLabels.every(s => typeof s === 'string') ||
      optimalSeqLabels.length !== optimal) throw new RangeError('Invalid finesse hint');
    const route = optimal === 0 ? '移動も回転もせず、ハードドロップだけで大丈夫です。'
      : `こうすると${optimal}回で置けますよ：${optimalSeqLabels.join(' → ')}。最後はハードドロップです。`;
    const extra = Math.max(0, used - optimal);
    return `${piece}ミノは今回${used}回、最短は${optimal}回です。${extra ? `あと${extra}回、入力を減らせますね♪ ` : '道順を確かめましょうね♪ '}${route}`;
  }
  function sprintComment(accuracy, pps) {
    if (!Number.isFinite(accuracy) || accuracy < 0 || accuracy > 100 || !Number.isFinite(pps) || pps < 0) {
      throw new RangeError('Accuracy must be 0..100 and PPS must be nonnegative');
    }
    return SPRINT_COMMENTS.accuracy.find(tier => accuracy >= tier.min).text +
      ' ' + SPRINT_COMMENTS.pps.find(tier => pps >= tier.min).text;
  }
  const DIALOGUE = deepFreeze({ welcome: WELCOME_LINES, praise: PRAISE_LINES, streak: STREAK_LINES,
    perPiece: PIECE_PRAISE, miss: MISS_LINES, encouragement: ENCOURAGEMENT_LINES,
    tips: TIPS, sprint: SPRINT_COMMENTS });

  /** All DISTINCT empty-board landings grouped by the engine's canonical
   * optimal action sequence, including [] (no movement). x is zero-based
   * occupied-left-column, column is its one-based display equivalent. Symmetric
   * rotations share a cell set and appear exactly once. No handwritten table.
   * Pass {allow180:false} when the app disables 180; default matches the engine.
   * The result is fresh mutable data, isolated from engine and lesson caches.
   */
  function lessonPlacementGroups(piece, opts = {}) {
    const groups = new Map();
    for (const placement of engine.allPlacements(piece, { allow180: opts.allow180 !== false })) {
      const signature = JSON.stringify(placement.actions);
      if (!groups.has(signature)) groups.set(signature, {
        id: piece + '-' + (placement.actions.join('-') || 'drop'), piece,
        count: placement.count, actions: placement.actions.slice(), sequence: placement.sequence.slice(),
        label: placement.sequence.length ? placement.sequence.join(' → ') : 'そのままハードドロップ',
        placements: []
      });
      groups.get(signature).placements.push({ ...placement, column: placement.x + 1,
        rotationLabel: engine.ROTATIONS[placement.rot],
        label: `${engine.ROTATIONS[placement.rot]}向き・左から${placement.x + 1}列目` });
    }
    return Array.from(groups.values()).sort((a, b) => a.count - b.count ||
      (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
  }

  const PIECE_LESSON_TEXT = deepFreeze({
    I: ['Iミノは4マスのまっすぐな形です。縦と横の置き方を覚えましょう！',

    O: ['Oミノは2×2の四角です。回転しても、置く形と位置は変わりませんよ。',

      '壁までころん、ひとつ戻ってころん♪ OミノでDASの感覚を覚えましょう。'],
    T: ['Tミノは上に1マス出た形です。4つの向きと列をセットで覚えましょう。',
      '右向きはCW、左向きはCCWが候補です。下向きは、設定で有効なら180°回転1回でも作れますよ。',
      '向きを先に決めると、移動中に迷いにくくなりますね♪'],
    L: ['Lミノは出現時の右上に1マスある形です。4つの向きを見てみましょう。',

      '左上の小さな角を目印にすると、向きを覚えやすいですよ♪'],
    S: ['Sミノは右上がりの階段のような形です。横と縦の2種類を練習しましょう。',
      '0と2、RとLは同じ着地の形です。180°回転で形を変える必要はありませんよ。',
      'CWとCCWで同じ縦の形でも列が変わります。最短の道順は表で見てみましょう♪'],
    Z: ['Zミノは左上がりの階段のような形です。Sミノと斜めの向きが逆ですよ。',
      '着地の形は横と縦の2種類です。同じ形になる回転状態も、最短回数をまとめて調べています。',
      '赤い階段の向きを見てから、回転と移動を選びましょうね♪']
  });

  // Declarative demo schema (JSON serializable; app.js owns time and drawing):
  // sequence = engine solver action IDs; dasLeft/dasRight mean key holds until
  // DAS/ARR reaches the wall, NOT literal InputHandler action names. finish is
  // hardDrop (0 finesse cost). For each variant reset to an empty-board spawn.
  // buffered events happen during ARE; keep held actions down through spawn.
  // An app can use InputHandler for those events, including IRS/IHS, and render
  // target.cells directly. Targets always use engine coordinates (y up).
  function demoVariant(piece, id, sequence, settings) {
    const board = new engine.Board();
    let state = engine.spawnPiece(piece);
    for (const action of sequence) {
      state = engine.applyAction(board, state, action, settings);
      if (!state) throw new Error('Invalid lesson demonstration: ' + id);
    }
    const lock = engine.hardDrop(board, state);
    return { id, piece, sequence: sequence.slice(), labels: sequence.map(a => engine.ACTION_LABELS[a]),
      inputCount: sequence.length, target: engine.finesseFor(piece, engine.cells(lock), settings),
      finish: 'hardDrop' };
  }
  function practice(piece, targets, settings) {
    return { piece, targets, requireOptimal: true, hints: true, settings: { ...settings } };
  }
  function pieceStep(piece, settings) {
    const placementGroups = lessonPlacementGroups(piece, settings);
    const all = placementGroups.flatMap(group => group.placements);
    const left = engine.finesseFor(piece, { rot: 0, x: 0 }, settings);
    const center = all.find(target => target.count === 0);
    const edge = piece === 'O' ? engine.finesseFor(piece, { rot: 0, x: 8 }, settings)
      : all.filter(target => target.rot !== 0).sort((a, b) => b.x - a.x || a.count - b.count)[0];
    const targets = [left, center, edge];
    return { id: 'piece-' + piece, title: piece + 'ミノのレッスン', expression: 'normal',
      lines: [...PIECE_LESSON_TEXT[piece],
        '表は最短の手順ごとにまとめています。列はミノのいちばん左のマスを、左端から1、2と数えますよ。',
        '3つの実演を見たら、同じミノの目標に挑戦しましょう！ヒントを見ながらで大丈夫です♪'],
      demo: { type: 'piece-placements', piece, settings: { ...settings }, placementGroups,
        examples: targets.map((target, i) => demoVariant(piece, piece + '-example-' + (i + 1), target.actions, settings)),
        targets },
      tryIt: practice(piece, targets, settings) };
  }

  /** Exactly the SPEC's 12 steps. Rebuild when allow180 changes so tables,
   * demonstrations, hints, and required counts all use the live solver option.
   * IRS/IHS demo overrides enable the feature and lengthen ARE for visibility;
   * app.js should apply these temporarily to its demonstration handler only.
   */
  function createLessons(opts = {}) {
    const settings = { allow180: opts.allow180 !== false, gravity: 0, spawnDrop: false };
    const dasTarget = engine.finesseFor('O', { rot: 0, x: 0 }, settings);
    const rotationVariants = [demoVariant('T', 'cw', ['cw'], settings),
      demoVariant('T', 'ccw', ['ccw'], settings),
      demoVariant('T', 'half-turn', settings.allow180 ? ['rotate180'] : ['cw', 'cw'], settings)];
    const irsDemo = demoVariant('T', 'irs', ['cw'], settings);

    return deepFreeze([
      { id: 'finesse', title: 'フィネスとは？', expression: 'normal', lines: [
        'ミルテト学園へようこそ！ミルフィです♪ フィネスは、目標の場所へ最少のキー入力でミノを運ぶことです。',
        '道順が短くなると、素早く置きやすくなり、押し間違いも減らせますよ。まずは正確に試しましょうね。',
        '左右のタップ、壁までの長押し、回転はそれぞれ1入力です。ソフトドロップも押すたびに1入力に数えます。',
        'ハードドロップは回数に数えません。ホールドも数えませんが、このドリルではスキップ扱いで目標が変わりますよ。',
        '出現位置の真下が目標なら、移動と回転は0回です。まずはそのまま落としてみましょう♪'
      ], demo: { type: 'optimal-placement', piece: 'O', settings: { ...settings },
        ...demoVariant('O', 'zero-input', [], settings) },
      tryIt: practice('O', [ihsTarget], settings) },
      { id: 'das', title: 'なぜ壁までDAS？', expression: 'thinking', lines: [
        'Oミノを左端へ運びます。左を4回押すと4入力ですが、壁まで長押しするDASなら1入力ですよ。',
        'DASは、押してから連続移動が始まるまでの待ち時間です。長押し中の移動はまとめて1入力になります。',
        'ARRはその後の移動間隔です。ARRが0なら、DASがたまると壁まで一気に移動しますよ。',
        '設定でDASとARRを調整できます。まずは待ってからすべる感覚を、ミルフィと確かめましょう♪'
      ], demo: { type: 'compare-sequences', piece: 'O', settings: { ...settings, das: 110, arr: 0 },
        targets: [dasTarget], variants: [demoVariant('O', 'four-taps', ['left', 'left', 'left', 'left'], settings),
          demoVariant('O', 'one-das', ['dasLeft'], settings)], settingsLink: 'handling' },
      tryIt: practice('O', [dasTarget], { ...settings, das: 110, arr: 0 }) },
      { id: 'rotation', title: '回転の基本（SRS・CW・CCW・180°）', expression: 'normal', lines: [
        'CWは右へ90°、CCWは左へ90°の回転です。両方を使うと、遠回りの回転を減らせますよ。',
        settings.allow180 ? '180°回転がオンなら、半回転も1入力です。Tミノを下向きにするときに試しましょう。'
          : '今は180°回転がオフです。半回転は90°回転を2回使います。オンにすると最短手順も変わりますよ。',
        'このゲームの回転はSRSです。壁や床にぶつかると、決められた順で位置を補正して回転を試します。',
        'Iミノの補正は専用で、Oミノは回しても置く形が変わりません。形と着地の影を見てくださいね。'
      ], demo: { type: 'rotation-basics', piece: 'T', settings: { ...settings }, variants: rotationVariants,
        targets: rotationVariants.map(variant => variant.target), rotationSystem: 'SRS', kickSource: 'engine' },
      tryIt: practice('T', rotationVariants.map(variant => variant.target), settings) },
      { id: 'irs-ihs', title: 'IRS・IHSとARE', expression: 'surprised', lines: [
        'IRSは出現時の先行回転です。次のミノが出る瞬間に回転キーを押し続けていると、回転した状態で出てきます！',
        'AREは次のミノが出るまでの待ち時間です。この間に回転キーを押し、出現する瞬間まで長押ししてみましょう。',
        'IRSの回転も新しいミノの1入力です。通常と同じSRSの補正を使い、回転できないときは元の向きで出現します。複数の回転キーでは最後に押したものが優先ですよ。',
        'IHSは出現時の先行ホールドです。オンなら、ARE中にホールドを押すか、出現時まで長押しすると交換できます。',
        'ホールドは1個につき固定まで1回です。ドリルではスキップ扱いで目標も変わり、1種類だけの練習では使えません。',
        '設定でIRSは初期オン、IHSは初期オフ、AREは初期80msです。練習ではAREを少し長くすると押すタイミングをつかみやすいですよ♪'
      ], demo: { type: 'spawn-buffer', piece: 'T', settings: { ...settings, irs: true, ihs: true, are: 350 },
        targets: [irsDemo.target, ihsTarget], variants: [
          { ...irsDemo, type: 'irs', buffered: [{ action: 'cw', during: 'are', holdThroughSpawn: true }] },
          { id: 'ihs', type: 'ihs', piece: 'T', heldPiece: 'O', nextPiece: 'I',
            buffered: [{ action: 'hold', during: 'are', holdThroughSpawn: true }],
            sequence: [], labels: [], inputCount: 0, target: ihsTarget, finish: 'hardDrop', holdCounts: false }
        ], settingsLink: 'handling' },
      tryIt: { ...practice('T', [irsDemo.target], { ...settings, irs: true, ihs: false, are: 350 }),
        requireIRS: true, bufferedAction: 'cw' } },
      ...['I', 'O', 'T', 'L', 'J', 'S', 'Z'].map(piece => pieceStep(piece, settings)),
      { id: 'summary', title: 'まとめ：ドリルへ出発です♪', expression: 'happy', lines: [
        'レッスン修了です！まず向きと列を決めて、回転・タップ・DASの最短ルートを選びましょう。',
        'ハードドロップは入力回数に含みません。IRSの回転は1入力です。落とす前に目標の輪郭を確かめてくださいね。',
        '同じ最短回数なら、表と別の道順でもパーフェクトです。むずかしい場所はヒントと再挑戦で練習できますよ。',
        '進み具合はアプリに保存され、レッスン一覧からいつでも復習できます。ドリルでもミルフィが応援しますね♪'
      ], demo: { type: 'optimal-placement', piece: 'T', settings: { ...settings },
        ...demoVariant('T', 'summary-route', summaryTarget.actions, settings) },
      tryIt: practice('T', [summaryTarget], settings), next: 'drill' }
    ]);
  }
  const LESSONS = createLessons();

  return Object.freeze({ name: 'ミルフィ', EXPRESSIONS, EXPRESSION_LABELS, MASCOT_CSS, mascotSVG,
    DIALOGUE, PRAISE_LINES, STREAK_LINES, PIECE_PRAISE, MISS_LINES, ENCOURAGEMENT_LINES,
    WELCOME_LINES, TIPS, SPRINT_COMMENTS, hintText, sprintComment,
    LESSONS, createLessons, lessonPlacementGroups });
});

    pause: '一時停止', skip: '次の目標', settings: '設定を開く', hint: 'ヒント切替' };
  const UI_DEFAULTS = { zeroFault: false, repeatOnFault: false, repeatOnMiss: true, showTarget: true,

  function updatePractice(next) {

  function blur() {
    // Freeze first, then release: releasing a newer direction cannot resume an
    // older charged direction beneath a pause overlay.
    if (session?.running) { pauseSession(); processEvents(); showPause(); }
    else releaseAll();
    save();
  }
  window.addEventListener('blur', blur);
  document.addEventListener('visibilitychange', () => { if (document.hidden) blur(); });
  let frameId = 0;
  function startFrames() { if (!frameId) frameId = requestAnimationFrame(frame); }
  window.addEventListener('pagehide', () => { blur(); cancelAnimationFrame(frameId); frameId = 0; });
  window.addEventListener('pageshow', startFrames);
  window.addEventListener('resize', () => { fitLessonBoard(); drawMinis(); });
  function frame() {
    frameId = 0;
    const t = now();
    if (screen === 'play' || screen === 'tutorial' && tryMode) { session?.update(t); processEvents(); }
    if (screen === 'tutorial' && !tryMode) updateDemo(t);
    if (screen === 'play' || screen === 'tutorial') renderBoard(t);
    if (screen === 'play' && t - lastHUD > 90) {
      lastHUD = t; updateHUD(t);
      const attempts = session.stats.attempts;
      if (attempts && attempts % 7 === 0 && attempts !== lastTipAttempt && t - feedbackAt > 3200) {
        lastTipAttempt = attempts; setCoach(M.TIPS[tipIndex++ % M.TIPS.length], 'normal');
      }
    }
    if (toastUntil && t >= toastUntil) dismissToast();
    startFrames();
  }

  // Public, serializable browser-test seam. Gameplay is always driven by normal
  // KeyboardEvent dispatch or page.keyboard; no helper changes counts/results.
  window.__mirutet = Object.freeze({
    getState() {
      const handler = screen === 'tutorial' && !tryMode ? demo?.handler : session?.handler;
      return copy({ screen, settings, ui, bindings, practice, progress, lessonIndex, tryMode, tryIndex, tryDone,
        expression, bubble, irsCount, storageOK, hint, lastResult, trace,
        round: session?.round, stats: session?.snapshot(), totalStats: totalStats.snapshot(),
        active: handler?.active, pending: handler?.pending, inputs: handler?.inputs, inputCount: handler?.inputCount,
        held: handler ? [...handler.held.keys()] : [], heldPiece: handler?.heldPiece, flags: handler?.flags,
        paused: session?.pausedAt !== null && !!session,
        demo: demo ? { type: demo.variant.type, actions: demo.actions, target: demo.target } : null, sprintResult });
    },
    chooseTarget(type, target, { delay } = {}) {
      if (!session?.running || session.pausedAt !== null) throw new Error('Open a running drill first');
      const optimal = E.finesseFor(type, target, session.settings);
      if (!optimal) throw new Error('Unreachable debug target');
      releaseAll(); session._newRound(type, optimal); session.handler.board = session.boardTemplate.clone();
      session.handler.scheduleSpawn(type, now(), delay ?? session.settings.are); processEvents();
      $('#board')?.focus({ preventScroll: true }); return copy(optimal);
    },
    dispatch(code, down = true) { document.dispatchEvent(new KeyboardEvent(down ? 'keydown' : 'keyup', { code, bubbles: true, cancelable: true })); },
    storageKey: STORAGE
  });
  render(); startFrames();
})();
</script>
</body>
